name: vibetable
description: VibeTable — social table games platform (Flutter client).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Routing
  go_router: ^14.2.7

  # Functional helpers
  equatable: ^2.0.5

  # Local key/value + secure credential storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Value equality / sealed results
  fpdart: ^1.1.0

  # UI
  google_fonts: ^6.2.1

  # Cached, lazy-loaded network images (disk + memory cache, downsampling).
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/game_logos/
