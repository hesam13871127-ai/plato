name: vibetable
description: VibeTable — social table games platform (Flutter client).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.2.7

  # Functional helpers
  equatable: ^2.0.5

  # Local key/value + secure credential storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Value equality / sealed results
  fpdart: ^1.1.0

  # Social sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
